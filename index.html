<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>qbase</title>
  <!-- Inline script to prevent theme flash (FOUC) - must run before any CSS -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Critical styles to prevent image blow-up during lazy load -->
  <style>
    /* Prevent images from expanding beyond reasonable bounds during CSS load */
    img { max-width: 100%; max-height: 100vh; }
    .avatar img, [class*="avatar"] img { max-width: 48px; max-height: 48px; }
    .header-logo-image { max-height: 48px; max-width: 200px; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
